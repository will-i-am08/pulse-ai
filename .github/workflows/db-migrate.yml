name: DB migrate (prod)

# Prefer migrations on the Vercel production build (apps/web → migrate-prod.mjs):
# DATABASE_URL is already present there. This Actions job remains as a belt-and-
# suspenders path when the repo secret is configured.
#
# Requires repo secret DATABASE_URL (Settings → Secrets and variables → Actions)
# for this job to apply migrations. When unset, the job exits successfully and
# relies on the Vercel production build instead (avoids a permanent red check).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # migrate.ts only needs `pg` + `tsx` (no workspace build), so skip
      # package build scripts for a fast install.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations to prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL Actions secret is not set — skipping this job. Prod migrations run on the Vercel production build (scripts/migrate-prod.mjs)."
            echo "To also migrate from Actions, add DATABASE_URL under Settings → Secrets and variables → Actions."
            exit 0
          fi
          pnpm exec tsx scripts/migrate.ts
