name: DB migrate (prod)

# Vercel deploys `main` but does NOT run DB migrations, so shipping code that
# needs a new column/table before applying its migration takes prod down (this
# bit us via #64: a missing `users.deleted_at` 500'd every login). This job
# applies db/migrations/*.sql to the prod Neon DB on every push to main. The
# migrate script is idempotent (IF NOT EXISTS / drop-guarded constraints), so
# re-running on code-only merges is a safe, fast no-op.
#
# Requires a repo secret DATABASE_URL (Settings → Secrets and variables →
# Actions) — the same prod connection string used locally to migrate.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # migrate.ts only needs `pg` + `tsx` (no workspace build), so skip
      # package build scripts for a fast install.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Apply migrations to prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it in Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          pnpm exec tsx scripts/migrate.ts
