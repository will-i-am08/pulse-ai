<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kip</title>
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #ececec;
      --soft: #f5f5f7;
      --ok: #1a7f4e;
      --bad: #b42318;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: hidden; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; display: block; }

    /* —— landing (unchanged language) —— */
    .lp { background: #000; color: #f5f5f7; }
    .hero { min-height: 100svh; min-height: 100dvh; height: 100svh; height: 100dvh; position: relative; overflow: hidden; background: #000; }
    .nav {
      position: absolute; inset: 0 0 auto 0; z-index: 4;
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 28px 28px;
      background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 70%, transparent 100%);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: #fff; text-decoration: none; font-size: 19px; font-weight: 600; letter-spacing: -0.02em;
    }
    .nav-login { color: rgba(255,255,255,.84); text-decoration: none; font-size: 15px; }
    .nav-login:hover { color: #fff; }
    .hero-copy {
      position: absolute; left: 0; right: 0; top: 0; z-index: 3;
      text-align: center; padding: clamp(96px, 16vh, 148px) 24px 0; pointer-events: none;
    }
    .hero-copy a { pointer-events: auto; }
    .hero-copy::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 58%;
      background: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 52%, transparent 100%);
      z-index: -1;
    }
    .h1 {
      font-size: clamp(56px, 9vw, 92px); font-weight: 600; letter-spacing: -0.038em;
      line-height: 1.02; margin: 0 0 28px; color: #fff;
    }
    .pill {
      display: inline-block; background: #fff; color: #000; font-size: 17px; font-weight: 600;
      letter-spacing: -0.01em; padding: 12px 22px; border-radius: 980px; text-decoration: none; border: 0;
    }
    .pill:hover { background: #f5f5f7; }
    .trust { margin: 18px 0 0; font-size: 19px; color: rgba(255,255,255,.52); }
    .hero-product { position: absolute; inset: 0; z-index: 1; }
    .photo-bleed {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 40% 40%, #c9b7a2 0%, transparent 40%), linear-gradient(160deg, #8a7460, #2c241c);
    }
    .ideas {
      background: #f5f5f7; color: var(--ink);
      padding: 72px 28px 80px;
    }
    .ideas-head { text-align: center; max-width: 18ch; margin: 0 auto 40px; }
    .ideas-head h2 {
      font-size: clamp(36px, 5vw, 52px); font-weight: 600; letter-spacing: -0.035em;
      line-height: 1.08; margin: 0 0 10px;
    }
    .ideas-head p { margin: 0; font-size: 20px; color: var(--muted); }
    .how {
      list-style: none; margin: 0 auto; padding: 0;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      max-width: 1080px;
    }
    .how > li {
      background: #fff; border-radius: 28px; overflow: hidden;
      min-height: 420px;
    }
    .how > li > a {
      display: flex; flex-direction: column; height: 100%;
      text-decoration: none; color: inherit;
    }
    a.how-card:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -28px rgba(0,0,0,.4); }
    .how-card { transition: transform .2s, box-shadow .2s; }
    .how-visual {
      height: 240px; display: flex; align-items: flex-end; justify-content: flex-start;
      padding: 18px; position: relative;
    }
    .how-visual img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .how-visual .cap {
      position: relative; background: #e9e9eb; color: #1d1d1f;
      border-radius: 22px 22px 22px 8px; padding: 14px 16px; margin: 0;
      font-size: 16px; line-height: 1.35; max-width: 92%;
    }
    .how-visual.dark {
      background: #000; align-items: center; justify-content: center;
    }
    .how-yes {
      display: inline-block; background: #fff; color: #000; font-weight: 600;
      font-size: 28px; letter-spacing: -0.03em; padding: 12px 28px; border-radius: 980px;
    }
    .how-copy { padding: 22px 22px 26px; }
    .how-n { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
    .how-copy h3 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.03em;
      line-height: 1.12; margin: 8px 0 8px;
    }
    .how-copy p { margin: 0; font-size: 16px; color: var(--muted); }
    .close {
      background: #000; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 88px 24px 72px;
    }
    .close .h1 { color: #fff; }
    .footer {
      background: #000; color: rgba(255,255,255,.46);
      padding: 28px 28px 48px; display: flex; flex-wrap: wrap; gap: 14px 24px;
      justify-content: space-between; align-items: center; font-size: 14px;
    }
    .footer a { color: rgba(255,255,255,.46); text-decoration: none; }
    .footer a:hover { color: #fff; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 20px; }

    .thread { margin: 0; display: flex; flex-direction: column; gap: 14px; }
    .thread.closeup { position: relative; width: 100%; height: 100%; }
    .thread.isolated { width: min(420px, 100%); }
    .msg { display: flex; max-width: 86%; }
    .msg p { margin: 0; font-size: 21px; line-height: 1.35; }
    .out { align-self: flex-end; margin-left: auto; }
    .in { align-self: flex-start; }
    .thread.closeup .photo-msg { position: absolute; inset: 0; max-width: none; width: 100%; height: 100%; }
    .thread.closeup .photo { width: 100%; height: 100%; object-fit: cover; }
    .thread.closeup .in { position: absolute; left: 3vw; bottom: 11vh; z-index: 1; max-width: min(520px, 54vw); }
    .thread.closeup .yes-msg { position: absolute; right: 3vw; bottom: 4.5vh; z-index: 1; }
    .thread.isolated .photo { width: 240px; height: 240px; object-fit: cover; border-radius: 28px 28px 8px 28px; }
    .in p { border-radius: 22px 22px 22px 8px; padding: 14px 18px; }
    .dark .in p { background: #2c2c2e; color: #f5f5f7; }
    .light .in p { background: #e9e9eb; color: #1d1d1f; }
    .yes { font-weight: 600; border-radius: 22px 22px 8px 22px; padding: 10px 20px; margin: 0; }
    .dark .yes { background: #fff; color: #000; }
    .light .yes { background: #1d1d1f; color: #fff; }

    /* Lindy-inspired product storytelling, still black/white */
    .band { background: #fff; color: var(--ink); padding: 88px 28px 96px; }
    .band-inner { max-width: 1080px; margin: 0 auto; }
    .band h2 {
      font-size: clamp(36px, 5vw, 52px); font-weight: 600; letter-spacing: -0.035em;
      line-height: 1.08; margin: 0 0 12px; text-align: center;
    }
    .band > .band-inner > .lead, .band .sub {
      text-align: center; color: var(--muted); font-size: 20px; max-width: 36ch; margin: 0 auto 40px;
    }
    .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 28px; }
    .tcard {
      background: var(--soft); border-radius: 22px; padding: 22px 22px 24px; min-height: 160px;
    }
    .tcard h3 { margin: 0 0 8px; font-size: 19px; letter-spacing: -0.02em; }
    .tcard p { margin: 0; color: var(--muted); font-size: 16px; }
    .product-frame {
      background: var(--soft); border-radius: 28px; padding: 18px;
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px;
    }
    .pf {
      background: #fff; border-radius: 20px; padding: 18px 18px 16px; border: 1px solid var(--line);
    }
    .pf h4 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .rrow { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .rrow:last-child { border-bottom: 0; }
    .file {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
      background: var(--soft); border-radius: 12px; padding: 14px; color: #333; line-height: 1.5;
    }
    .who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin: 48px 0 56px; }
    .who h3 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.03em; }
    .who p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .dest {
      text-align: center; font-size: clamp(22px, 3vw, 28px); font-weight: 600;
      letter-spacing: -0.03em; margin: 0 0 10px;
    }
    .dest-note { text-align: center; color: var(--muted); font-size: 16px; margin: 0 0 48px; }
    .plate .sub { max-width: 42ch; }
    .ask { max-width: 640px; margin: 0 auto; }
    .composer {
      display: flex; gap: 8px; align-items: center;
      background: #fff; border: 1px solid var(--line); border-radius: 980px; padding: 8px 8px 8px 18px;
      box-shadow: 0 16px 50px -28px rgba(0,0,0,.35);
    }
    .composer input {
      flex: 1; border: 0; outline: none; font-size: 16px; background: transparent; padding: 10px 0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chip-link {
      font-size: 13px; padding: 6px 12px; border-radius: 980px; background: var(--soft);
      text-decoration: none; color: var(--ink);
    }

    /* —— app: teammate workspace —— */
    .desk {
      min-height: 100svh; display: grid; grid-template-columns: 232px 1fr;
      background: var(--soft);
    }
    .desk.three { grid-template-columns: 232px 1fr 340px; }
    .rail {
      background: #f3f3f5; padding: 18px 12px 24px; display: flex; flex-direction: column; gap: 4px;
    }
    .rail-nav { display: flex; flex-direction: column; gap: 4px; }
    .rail .brand { color: var(--ink); font-size: 17px; padding: 8px 10px 18px; }
    .rail a, .rail button.navb {
      display: block; width: 100%; text-align: left; text-decoration: none;
      padding: 9px 12px; border-radius: 10px; color: var(--muted); font-size: 15px;
      background: none; border: 0;
    }
    .rail a.on, .rail a:hover, .rail button.navb:hover { background: #fff; color: var(--ink); }
    .rail .spacer { flex: 1; }
    .stage {
      margin: 12px 12px 12px 0; background: #fff; border-radius: 22px;
      display: flex; flex-direction: column; min-height: calc(100svh - 24px); overflow: hidden;
    }
    .desk.three .stage { margin-right: 0; }
    .aside {
      margin: 12px 12px 12px 12px; background: #fff; border-radius: 22px; padding: 22px 20px;
      overflow: auto;
    }
    .aside h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .chat {
      flex: 1; overflow: auto; padding: 28px 32px 12px; display: flex; flex-direction: column; gap: 12px;
    }
    .bubble { max-width: 78%; }
    .bubble.kip p { background: #e9e9eb; border-radius: 22px 22px 22px 8px; padding: 12px 16px; margin: 0; }
    .bubble.you { margin-left: auto; }
    .bubble.you p { background: #1d1d1f; color: #fff; border-radius: 22px 22px 8px 22px; padding: 12px 16px; margin: 0; }
    .bubble img { width: 220px; height: 220px; object-fit: cover; border-radius: 22px 22px 8px 22px; }
    .dock { padding: 12px 20px 20px; }
    .page {
      flex: 1; overflow: auto; padding: 36px 40px 64px;
    }
    .page-h1 {
      font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.035em;
      margin: 0 0 8px; line-height: 1.1;
    }
    .lead { margin: 0 0 1.6rem; font-size: 18px; color: var(--muted); }
    .row { padding: 1.6rem 0; border-bottom: 1px solid var(--line); }
    .row h2, .panel h2 { margin: 0 0 8px; font-size: 19px; }
    .status { margin: 0; font-size: 21px; font-weight: 600; }
    .muted, .empty { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .setup { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 18px; }
    .setup-head { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
    .need, .done { font-size: 13px; font-weight: 500; }
    .done { color: var(--muted); }
    .quiet-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .quiet-form input { flex: 1 1 180px; }

    input[type="text"], input[type="tel"], input[type="email"], input[type="password"],
    input[type="number"], input[type="url"], input[type="datetime-local"], textarea, select {
      font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--ink);
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
    textarea { width: 100%; min-height: 96px; resize: vertical; }
    .pill-dark {
      display: inline-block; background: #000; color: #fff; font-size: 15px; font-weight: 600;
      padding: 11px 18px; border-radius: 980px; text-decoration: none; border: 0;
    }
    .pill-dark:hover { background: #1d1d1f; }
    .ghost { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 0; }
    .ghost:hover { color: var(--ink); }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .draft { display: grid; grid-template-columns: 140px 1fr; gap: 12px; font-size: 16px; }
    .when { color: var(--muted); font-size: 14px; }
    .caption { margin: 0; }
    .draft-actions { display: flex; gap: 12px; margin-top: 6px; }
    .text-btn { background: none; border: 0; padding: 0; font-size: 14px; color: var(--muted); }
    .text-btn:hover { color: var(--ink); }
    .text-btn.bad { color: var(--bad); }
    .banner { font-size: 15px; margin: 0 0 1rem; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .auth {
      min-height: 100svh; background: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 48px 20px 80px;
    }
    .auth-card { width: 100%; max-width: 420px; display: grid; gap: 14px; }
    .auth .page-h1 { font-size: 40px; }
    .auth .pill-dark { width: 100%; text-align: center; }
    .label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500; }
    .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
    .alt { text-align: center; color: var(--muted); font-size: 15px; }
    .alt a { color: var(--ink); }
    .operator { margin-top: 20px; width: 100%; max-width: 420px; color: var(--muted); font-size: 14px; text-align: center; }
    .operator summary { cursor: pointer; list-style: none; }
    .operator summary::-webkit-details-marker { display: none; }
    .operator-form { display: grid; gap: 10px; text-align: left; margin-top: 12px; }
    .radios { display: flex; gap: 18px; font-weight: 400; }
    .week-nav { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .week { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 8px; overflow-x: auto; }
    .day { min-height: 150px; border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--soft); }
    .day.today { background: #fff; border-color: #000; }
    .day-h { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .card-post { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 12px; margin-bottom: 8px; }
    .chip { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #eef1f5; }
    .chip.yes { background: #f3f3f4; }
    .chip.auto { background: #eafaf0; color: #1a7f4e; }
    .pillar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .choice {
      display: flex; gap: 12px; align-items: flex-start; padding: 16px;
      border: 1px solid var(--line); border-radius: 14px; cursor: pointer; margin-bottom: 10px;
    }
    .choice.disabled { opacity: .5; cursor: not-allowed; }
    .oauth { min-height: 100svh; display: grid; place-items: center; background: var(--soft); padding: 24px; }
    .oauth-card {
      background: #fff; border-radius: 20px; padding: 36px 28px; max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px -30px rgba(0,0,0,.3);
    }
    .doc p { font-size: 18px; color: var(--muted); }
    .files { display: grid; grid-template-columns: 180px 1fr; gap: 16px; }
    .files nav a {
      display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 14px;
    }
    .files nav a.on { background: var(--soft); color: var(--ink); }
    .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .brand-card {
      display: block; text-decoration: none; padding: 18px; border: 1px solid var(--line);
      border-radius: 16px; margin-bottom: 10px;
    }
    .brand-card:hover { background: var(--soft); }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
      background: #000; color: #fff; padding: 12px 18px; border-radius: 980px;
      font-size: 15px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    .proto {
      position: fixed; right: 16px; bottom: 16px; z-index: 50;
      background: #1d1d1f; color: #fff; border-radius: 16px; padding: 12px 14px;
      font-size: 12px; width: 220px;
    }
    .proto summary { cursor: pointer; font-weight: 600; list-style: none; }
    .proto nav { display: grid; gap: 4px; margin-top: 10px; }
    .proto a, .proto button {
      color: rgba(255,255,255,.8); text-decoration: none; background: none; border: 0;
      text-align: left; padding: 4px 0; font-size: 12px;
    }
    .proto a:hover, .proto button:hover { color: #fff; }
    .proto .note { color: rgba(255,255,255,.5); margin: 8px 0 0; }
    .mark { width: 36px; height: 36px; }
    .rail .mark { width: 22px; height: 22px; }

    @media (max-width: 980px) {
      .desk, .desk.three { grid-template-columns: 1fr; }
      .rail {
        position: sticky; top: 0; z-index: 12;
        flex-direction: row; align-items: center; gap: 8px;
        padding: 10px 12px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        border-bottom: 1px solid var(--line);
        background: rgba(243,243,245,.94);
        backdrop-filter: blur(12px);
      }
      .rail .brand { padding: 4px 8px 4px 2px; flex: 0 0 auto; }
      .rail .brand span { display: none; }
      .rail-nav {
        flex: 1; flex-direction: row; flex-wrap: nowrap;
        overflow-x: auto; -webkit-overflow-scrolling: touch;
        scrollbar-width: none; gap: 2px;
      }
      .rail-nav::-webkit-scrollbar { display: none; }
      .rail-nav a, .rail .navb {
        width: auto; white-space: nowrap; padding: 8px 12px; font-size: 14px;
      }
      .rail .spacer { display: none; }
      .rail-out { flex: 0 0 auto; }
      .stage {
        margin: 0; border-radius: 0;
        min-height: calc(100dvh - 56px);
      }
      .desk.three .stage { margin: 0; }
      .aside { margin: 0; border-radius: 0; padding: 20px 18px 32px; }
      .page { padding: 24px 18px 48px; }
      .chat { padding: 18px 16px 8px; }
      .dock { padding: 10px 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
      .trio, .where, .product-frame, .files, .how, .who { grid-template-columns: 1fr; }
      .ideas { padding: 48px 20px 56px; }
      .how > li { min-height: 0; }
      .band { padding: 56px 20px 64px; }
      .who { gap: 22px; margin: 32px 0 40px; }
      .files nav { display: flex; gap: 6px; overflow-x: auto; }
      .week { padding-bottom: 8px; -webkit-overflow-scrolling: touch; }
    }
    @media (max-width: 640px) {
      .nav { padding: 14px 16px 24px; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
      .hero-copy { padding-top: 80px; }
      .h1 { font-size: clamp(40px, 11vw, 52px); margin-bottom: 18px; }
      .trust { font-size: 16px; padding: 0 8px; }
      .pill { font-size: 16px; padding: 12px 20px; }
      .thread.closeup .in {
        left: 16px; right: 16px; bottom: 12svh; max-width: none;
      }
      .thread.closeup .in p { font-size: 16px; }
      .thread.closeup .yes-msg { right: 16px; bottom: 4svh; }
      .ideas { padding: 40px 16px 48px; }
      .how-visual { height: 200px; }
      .dest { font-size: 20px; line-height: 1.35; }
      .ask .composer, .dock .composer {
        flex-direction: column; align-items: stretch;
        border-radius: 20px; padding: 10px;
      }
      .ask .composer .pill-dark, .dock .composer .pill-dark { width: 100%; text-align: center; }
      .footer { padding: 24px 16px 40px; flex-direction: column; align-items: flex-start; }
      .draft { grid-template-columns: 1fr; }
      .bubble img { width: 180px; height: 180px; }
      .bubble { max-width: 92%; }
      .auth { padding: 32px 16px 48px; }
      .auth .page-h1 { font-size: 32px; }
      .radios { flex-direction: column; gap: 10px; }
      .proto {
        right: 10px; bottom: 10px; width: min(196px, calc(100vw - 20px));
        max-height: 42vh; overflow: auto;
      }
      .toast { bottom: 16px; left: 12px; right: 12px; transform: none; text-align: center; }
      .close { padding: 64px 20px 56px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <details class="proto">
    <summary>Prototype jumps</summary>
    <nav>
      <a href="#/">Landing</a>
      <a href="#/signup">Sign up</a>
      <a href="#/login">Log in</a>
      <a href="#/home">Thread</a>
      <a href="#/plan">Calendar</a>
      <a href="#/routines">Routines</a>
      <a href="#/memory">Memory</a>
      <a href="#/connections">Connections</a>
      <a href="#/operator">Operator</a>
      <a href="#/brand">Approvals</a>
      <button type="button" data-state="setup">State: setting up</button>
      <button type="button" data-state="live">State: connected</button>
    </nav>
    <p class="note">Clickable mock. Download this file when you’re happy.</p>
  </details>

  <script>
    const PHOTO = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1800&q=80";
    const CROISSANT = "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=800&q=80";

    const mark = (cls = "mark") =>
      `<svg class="${cls}" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="18" fill="currentColor"/><path d="M13 11h5.2c3.4 0 5.6 1.9 5.6 4.8 0 1.9-1 3.3-2.7 4.1L24.8 25h-3.4l-3.4-4.7H16V25h-3V11zm3 6.8h1.9c1.6 0 2.6-.8 2.6-2s-1-2-2.6-2H16v6.8z" fill="#fff"/></svg>`;

    const state = {
      connected: false,
      phoneSet: false,
      x: false,
      threads: false,
      name: "Harbour Espresso",
      phone: "0412 000 000",
      page: "Harbour Espresso",
      ig: "harbourespresso",
      banner: "",
      file: "memory.md",
      skills: { draft: true, replies: true, reports: true, ads: false },
      memory: "Weekly report goes out Mondays, 9am.\\nNever post without a yes.\\nTone is warm, short, no hype.\\nAlmond croissant is the hero pastry.",
      messages: [
        { who: "you", photo: true },
        { who: "kip", text: "Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go.\\n\\nReply yes to post." },
        { who: "you", text: "yes" }
      ],
      waiting: [
        { id: "w1", when: "Thu 11 Sep, 7:30 am", caption: "Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go." }
      ],
      upcoming: [
        { id: "u1", when: "Fri 12 Sep, 8:00 am", caption: "Behind the bar before open. Steam, sunlight, same playlist as last year." },
        { id: "u2", when: "Sat 13 Sep, 9:00 am", caption: "Almond croissant, still warm. That’s the post." }
      ]
    };

    const routes = {};
    const route = (path, fn) => { routes[path] = fn; };
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function go(path) { location.hash = path.startsWith("#") ? path : "#" + path; }

    function rail(active) {
      return `
        <aside class="rail">
          <a class="brand" href="#/home">${mark("mark")} <span>Kip</span></a>
          <nav class="rail-nav">
            <a href="#/home" class="${active === "home" ? "on" : ""}">Thread</a>
            <a href="#/plan" class="${active === "plan" ? "on" : ""}">Calendar</a>
            <a href="#/routines" class="${active === "routines" ? "on" : ""}">Routines</a>
            <a href="#/memory" class="${active === "memory" ? "on" : ""}">Memory</a>
            <a href="#/connections" class="${active === "connections" ? "on" : ""}">Connections</a>
            <a href="#/content-plan" class="${active === "content" ? "on" : ""}">Plan</a>
            <a href="#/operator">Operator</a>
          </nav>
          <div class="spacer"></div>
          <button class="navb rail-out" data-go="#/">Sign out</button>
        </aside>`;
    }

    function desk(active, main, aside) {
      return `<div class="desk ${aside ? "three" : ""}">${rail(active)}${main}${aside || ""}</div>`;
    }

    function thread(tone, size) {
      const img = size === "closeup"
        ? `<div class="photo-bleed photo" role="img" aria-label="A coffee and an almond croissant" style="background-image:url('${PHOTO}');background-size:cover;background-position:center"></div>`
        : `<img class="photo" src="${CROISSANT}" alt="A photo of a coffee and an almond croissant" />`;
      return `
        <figure class="thread ${tone} ${size}" aria-label="A text thread: a photo sent, a caption back, the word yes">
          <div class="msg out photo-msg">${img}</div>
          <div class="msg in"><p>Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go.<br><br>Reply yes to post.</p></div>
          <div class="msg out yes-msg"><p class="yes">yes</p></div>
        </figure>`;
    }

    route("/", () => `
      <main class="lp">
        <section class="hero" aria-label="Kip">
          <header class="nav">
            <span class="brand">${mark()} <span>Kip</span></span>
            <a class="nav-login" href="#/login">Operator login</a>
          </header>
          <div class="hero-copy">
            <h1 class="h1">Text a photo.<br>It’s posted.</h1>
            <a class="pill" href="#/signup">Get started</a>
            <p class="trust">Kip can take the lot. Nothing posts without your yes.</p>
          </div>
          <div class="hero-product">${thread("dark", "closeup")}</div>
        </section>
        <section class="ideas" aria-label="How Kip works">
          <div class="ideas-head">
            <h2>Three moves.</h2>
            <p>That’s the loop. Kip can also run the rest.</p>
          </div>
          <ol class="how">
            <li>
              <a class="how-card" href="#/signup">
                <div class="how-visual">
                  <img src="${CROISSANT}" alt="A photo of an almond croissant" />
                </div>
                <div class="how-copy">
                  <div class="how-n">01</div>
                  <h3>You send a photo.</h3>
                  <p>From the floor, in the thread. That’s the brief.</p>
                </div>
              </a>
            </li>
            <li>
              <a class="how-card" href="#/signup">
                <div class="how-visual">
                  <p class="cap">Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go.</p>
                </div>
                <div class="how-copy">
                  <div class="how-n">02</div>
                  <h3>Kip writes it.</h3>
                  <p>In your voice. In the same thread you sent the photo.</p>
                </div>
              </a>
            </li>
            <li>
              <a class="how-card" href="#/signup">
                <div class="how-visual dark">
                  <span class="how-yes">yes</span>
                </div>
                <div class="how-copy">
                  <div class="how-n">03</div>
                  <h3>You say yes.</h3>
                  <p>Instagram, Facebook, X, Threads. Organic, and done.</p>
                </div>
              </a>
            </li>
          </ol>
        </section>

        <section class="band plate">
          <div class="band-inner">
            <h2>Hand it the whole job.</h2>
            <p class="sub">Captions, the calendar, the Monday nudge, the Friday recap. Kip will run organic social until you say otherwise. Stay in the thread and tap yes — or put it on autopilot and get your evenings back.</p>
            <div class="who">
              <article>
                <h3>The shop</h3>
                <p>You were busy making the thing. Send a photo from the floor. Or don’t. Kip already knows the week.</p>
              </article>
              <article>
                <h3>The creator</h3>
                <p>Same voice, every channel, without becoming a content intern. You make the work. Kip ships it.</p>
              </article>
              <article>
                <h3>The founder</h3>
                <p>You should not also be the social media manager. This is that hire — without the awkward stand-up.</p>
              </article>
            </div>
            <p class="dest">Instagram · Facebook · X · Threads</p>
            <p class="dest-note">Organic social. That’s the niche. Kip intends to be first in it.</p>
            <div class="product-frame">
              <div class="pf">
                <h4>On its plate</h4>
                <div class="rrow"><span>Weekly check-in</span><span class="opt">Mondays · 9:00 am</span></div>
                <div class="rrow"><span>Friday recap</span><span class="opt">Fridays · 4:00 pm</span></div>
                <div class="rrow"><span>Quiet reminder</span><span class="opt">If no photo in 10 days</span></div>
                <div class="rrow"><span>Autopilot</span><span class="opt">Heads-up, then it posts</span></div>
              </div>
              <div class="pf">
                <h4>memory.md</h4>
                <div class="file">Organic only — Instagram, Facebook, X, Threads.<br>Never post without a yes, unless autopilot is on.<br>Tone is warm, short, no hype.<br>Almond croissant is the hero pastry.</div>
              </div>
            </div>
            <div class="ask" style="margin-top:48px">
              <form class="composer" data-landchat>
                <input name="q" placeholder="Tell Kip you’re done doing social yourself…" />
                <button class="pill-dark" type="submit">Get started</button>
              </form>
              <div class="chips">
                <a class="chip-link" href="#/signup">I’m a café</a>
                <a class="chip-link" href="#/signup">I’m a creator</a>
                <a class="chip-link" href="#/signup">I’m a founder</a>
              </div>
            </div>
          </div>
        </section>

        <section class="close">
          <h2 class="h1">Text a photo.<br>It’s posted.</h2>
          <p class="trust">Or don’t. Kip will.</p>
          <a class="pill" href="#/signup">Get started</a>
        </section>
        <footer class="footer">
          <span>© 2026 Pulse Social Media</span>
          <span class="footer-links">
            <a href="mailto:will@jmcalder.com">will@jmcalder.com</a>
            <a href="#/privacy">Privacy</a>
            <a href="#/terms">Terms</a>
            <a href="#/deletion">Data deletion</a>
          </span>
        </footer>
      </main>`);

    route("/login", () => `
      <main class="auth">
        <form class="auth-card" data-login>
          <h1 class="page-h1">Log in</h1>
          <p class="lead" style="margin:0">Enter your mobile number and Kip will text you a code.</p>
          <label class="label">Mobile number
            <input name="phone" type="tel" required placeholder="04xx xxx xxx" value="0412 000 000" />
          </label>
          <button class="pill-dark" type="submit">Send me a code</button>
          <p class="alt">New here? <a href="#/signup">Create an account</a></p>
        </form>
        <details class="operator">
          <summary>Operator login</summary>
          <form class="operator-form" data-operator>
            <label class="label">Operator password
              <input type="password" name="password" value="operator" />
            </label>
            <button class="pill-dark" type="submit">Sign in as operator</button>
            <span class="opt">Break-glass access. Any password works in this mock.</span>
          </form>
        </details>
      </main>`);

    route("/signup", () => `
      <main class="auth">
        <form class="auth-card" data-signup>
          <h1 class="page-h1">Meet Kip</h1>
          <p class="lead" style="margin:0">Kip will message you. No password. Organic social, off your plate.</p>
          <label class="label">Your name or business name<input name="name" required value="Harbour Espresso" /></label>
          <label class="label">Mobile number
            <input name="phone" type="tel" required placeholder="04xx xxx xxx" value="0412 000 000" />
            <span class="opt">This is how you log in.</span>
          </label>
          <label class="label">Email <span class="opt">(optional)</span><input name="email" type="email" /></label>
          <fieldset style="border:1px solid var(--line);border-radius:12px;padding:12px">
            <legend class="opt">I’m a…</legend>
            <div class="radios" style="flex-wrap:wrap">
              <label><input type="radio" name="account_type" value="shop" checked /> Shop</label>
              <label><input type="radio" name="account_type" value="creator" /> Creator</label>
              <label><input type="radio" name="account_type" value="founder" /> Founder</label>
            </div>
          </fieldset>
          <label class="label">Website or Instagram <span class="opt">(optional)</span><input name="website" placeholder="https://…" /></label>
          <button class="pill-dark" type="submit">Create account</button>
          <p class="alt">Already have an account? <a href="#/login">Log in</a></p>
        </form>
      </main>`);

    route("/verify", () => `
      <main class="auth">
        <form class="auth-card" data-verify>
          <h1 class="page-h1">Enter your code</h1>
          <p class="lead" style="margin:0">Kip just messaged a 6-digit code to ${state.phone}. Any 6 digits work here.</p>
          <label class="label">Code<input name="code" inputmode="numeric" maxlength="6" required value="123456" /></label>
          <button class="pill-dark" type="submit">Verify and continue</button>
        </form>
      </main>`);

    function needsRail() {
      return `
        <aside class="aside">
          <h2>Needs a yes</h2>
          ${state.waiting.length ? state.waiting.map(p => `
            <p class="caption">${p.caption}</p>
            <p class="opt">${p.when}</p>
            <div class="draft-actions">
              <button class="text-btn" data-approve="${p.id}">Approve</button>
              <button class="text-btn bad" data-remove="${p.id}">Remove</button>
            </div>`).join("") : `<p class="empty">Nothing waiting. Reply yes in the thread.</p>`}
          <h2 style="margin-top:28px">Upcoming</h2>
          ${state.upcoming.map(p => `<div class="rrow"><span>${p.when}</span></div>`).join("") || `<p class="empty">Nothing scheduled.</p>`}
          ${!state.connected ? `<p style="margin-top:24px"><a class="pill-dark" href="#/oauth-fb">Connect Facebook</a></p>` : `<p class="empty" style="margin-top:24px">${state.page} · @${state.ig}</p>`}
        </aside>`;
    }

    route("/home", () => desk("home", `
      <section class="stage">
        <div class="chat">
          ${state.messages.map(m => {
            if (m.photo) return `<div class="bubble you"><img src="${CROISSANT}" alt="Photo you sent" /></div>`;
            return `<div class="bubble ${m.who === "kip" ? "kip" : "you"}"><p>${m.text.replace(/\\n/g, "<br>")}</p></div>`;
          }).join("")}
        </div>
        <div class="dock">
          <form class="composer" data-chat>
            <input name="q" placeholder="Tell Kip what to post, or drop a photo…" required />
            <button class="pill-dark" type="submit">Send</button>
          </form>
        </div>
      </section>`, needsRail()));

    route("/oauth-fb", () => `
      <main class="oauth"><div class="oauth-card">
        <h1 class="page-h1" style="font-size:28px">Continue with Facebook</h1>
        <p class="lead">Fake Meta screen. Kip would like to manage your Pages and linked Instagram.</p>
        <p style="display:flex;gap:10px"><a class="pill-dark" href="#/connect">Continue</a><a class="ghost" href="#/home">Cancel</a></p>
      </div></main>`);

    route("/connect", () => desk("connections", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">Choose the account</h1>
        <p class="lead">Pick the Facebook Page and linked Instagram Kip will post to.</p>
        <form data-choose>
          <label class="choice"><input type="radio" name="page" value="Harbour Espresso" checked /> <span><strong>Harbour Espresso</strong><br><span class="opt">Instagram: @harbourespresso</span></span></label>
          <label class="choice"><input type="radio" name="page" value="Harbour Events" /> <span><strong>Harbour Events</strong><br><span class="opt">Instagram: @harbourevents</span></span></label>
          <label class="choice disabled"><input type="radio" disabled /> <span><strong>Old pop-up page</strong><br><span class="opt">No Instagram linked</span></span></label>
          <button class="pill-dark" type="submit">Connect this account</button>
        </form>
      </div></section>`));

    route("/oauth-x", () => `
      <main class="oauth"><div class="oauth-card">
        <h1 class="page-h1" style="font-size:28px">Authorize Kip on X</h1>
        <p class="lead">Fake X screen.</p>
        <p style="display:flex;gap:10px"><button class="pill-dark" data-connect="x" type="button">Authorize app</button><a class="ghost" href="#/connections">Cancel</a></p>
      </div></main>`);

    route("/oauth-threads", () => `
      <main class="oauth"><div class="oauth-card">
        <h1 class="page-h1" style="font-size:28px">Authorize Kip on Threads</h1>
        <p class="lead">Fake Threads screen.</p>
        <p style="display:flex;gap:10px"><button class="pill-dark" data-connect="threads" type="button">Authorize app</button><a class="ghost" href="#/connections">Cancel</a></p>
      </div></main>`);

    route("/connections", () => desk("connections", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">Connections</h1>
        <p class="lead">Kip asks before it alters anything. Connect the places it may post.</p>
        ${state.banner ? `<p class="banner ${state.banner.ok ? "ok" : "bad"}">${state.banner.text}</p>` : ""}
        <article class="row">
          <div class="setup-head"><span>Instagram & Facebook</span><span class="${state.connected ? "done" : "need"}">${state.connected ? "Connected" : "Needs you"}</span></div>
          <p class="empty">${state.connected ? state.page + " · @" + state.ig : "Sign in with Facebook and choose the Page."}</p>
          <p><a class="pill-dark" href="#/oauth-fb">${state.connected ? "Reconnect" : "Connect with Facebook"}</a></p>
        </article>
        <article class="row">
          <div class="setup-head"><span>Phone</span><span class="${state.phoneSet ? "done" : "need"}">${state.phoneSet ? "Done" : "Needs you"}</span></div>
          <form class="quiet-form" data-phone>
            <input name="phone" required placeholder="04xx xxx xxx" value="${state.phoneSet ? state.phone : ""}" />
            <button class="pill-dark" type="submit">${state.phoneSet ? "Update" : "Save number"}</button>
          </form>
        </article>
        <article class="row">
          <div class="setup-head"><span>X (optional)</span><span class="${state.x ? "done" : "need"}">${state.x ? "Connected" : "Off"}</span></div>
          <p><a class="pill-dark" href="#/oauth-x">${state.x ? "Reconnect" : "Connect X"}</a></p>
        </article>
        <article class="row">
          <div class="setup-head"><span>Threads (optional)</span><span class="${state.threads ? "done" : "need"}">${state.threads ? "Connected" : "Off"}</span></div>
          <p><a class="pill-dark" href="#/oauth-threads">${state.threads ? "Reconnect" : "Connect Threads"}</a></p>
        </article>
      </div></section>`));

    route("/plan", () => {
      const days = ["Mon 8", "Tue 9", "Wed 10", "Thu 11", "Fri 12", "Sat 13", "Sun 14"].map((d, i) => {
        const posts = [];
        if (i === 3 && state.waiting[0]) posts.push({ ...state.waiting[0], chip: "Needs a yes", cls: "yes" });
        if (i === 4 && state.upcoming[0]) posts.push({ ...state.upcoming[0], chip: "Autopilot", cls: "auto" });
        if (i === 5 && state.upcoming[1]) posts.push({ ...state.upcoming[1], chip: "Autopilot", cls: "auto" });
        return { label: d, today: i === 2, posts };
      });
      return desk("plan", `
        <section class="stage"><div class="page">
          <h1 class="page-h1">Calendar</h1>
          <div class="week-nav">
            <button class="ghost" type="button" data-toast="Previous week (mock)">← Prev</button>
            <span class="opt">Week of 8 Sep</span>
            <button class="ghost" type="button" data-toast="Next week (mock)">Next →</button>
          </div>
          <div class="week">
            ${days.map(d => `
              <div class="day ${d.today ? "today" : ""}">
                <div class="day-h">${d.label}</div>
                ${d.posts.map(p => `
                  <div class="card-post">
                    <div style="display:flex;justify-content:space-between;gap:6px"><strong>${(p.when.split(", ")[1] || "")}</strong><span class="chip ${p.cls}">${p.chip}</span></div>
                    <div>${p.caption.slice(0, 64)}…</div>
                    <button class="text-btn bad" data-remove="${p.id}">Remove</button>
                  </div>`).join("") || `<span class="opt">—</span>`}
              </div>`).join("")}
          </div>
          <div class="row" style="border:0">
            <h2>Cadence</h2>
            <p class="empty" style="margin-top:0">Autopilot still sends a heads-up before each post.</p>
            ${[["#6366f1","Behind the scenes",2],["#ec4899","Product",2],["#10b981","Social proof",1]].map(([c,n,w]) => `
              <form class="pillar" data-pillar>
                <span class="dot" style="background:${c}"></span>
                <strong style="flex:1">${n}</strong>
                <label class="opt"><input type="number" value="${w}" min="0" max="14" style="width:64px" /> / week</label>
                <label class="opt"><input type="checkbox" ${n==="Product"?"checked":""} /> Autopilot</label>
                <button class="text-btn" type="submit">Save</button>
              </form>`).join("")}
          </div>
        </div></section>`);
    });

    route("/routines", () => desk("routines", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">Routines</h1>
        <p class="lead">Whatever you do on repeat, hand it to Kip. A sentence is all it takes.</p>
        <div class="rrow"><span>Weekly check-in</span><span class="opt">Mondays · 9:00 am</span></div>
        <div class="rrow"><span>Friday recap</span><span class="opt">Fridays · 4:00 pm</span></div>
        <div class="rrow"><span>Quiet reminder</span><span class="opt">If no photo in 10 days</span></div>
        <form data-routine class="quiet-form" style="margin-top:22px">
          <input name="r" placeholder="e.g. Nudge me every Thursday for a reel" required />
          <button class="pill-dark" type="submit">Add routine</button>
        </form>
        <h2 style="margin-top:36px">Skills</h2>
        <p class="empty" style="margin:0 0 8px">Kip picks the right one on its own. Flip any off.</p>
        ${[["draft","Draft captions"],["replies","Reply to comments"],["reports","Weekly reports"],["ads","Paid ads"]].map(([k,n]) => `
          <label class="toggle"><span>${n}</span>
            <input type="checkbox" data-skill="${k}" ${state.skills[k] ? "checked" : ""} />
          </label>`).join("")}
      </div></section>`));

    route("/memory", () => {
      const files = {
        "memory.md": state.memory,
        "voice.md": "tone: warm, playful, concise\\ndos: talk like a local, name the pastry\\ndonts: no corporate, no hashtag dumps\\nemoji: sparingly",
        "brand.md": state.name + "\\nInstagram @" + state.ig + "\\nPhone " + state.phone
      };
      const body = files[state.file] || files["memory.md"];
      return desk("memory", `
        <section class="stage"><div class="page">
          <h1 class="page-h1">Memory</h1>
          <p class="lead">Everything Kip knows, in plain files. Change it like a doc.</p>
          <div class="files">
            <nav>
              ${["memory.md","voice.md","brand.md"].map(f => `<a href="#/memory" data-file="${f}" class="${state.file===f?"on":""}">${f}</a>`).join("")}
            </nav>
            <form data-memory>
              <textarea name="body" style="min-height:280px;font-family:ui-monospace,Menlo,monospace;font-size:14px">${body.replace(/\\n/g, "\n")}</textarea>
              <p style="margin-top:12px"><button class="pill-dark" type="submit">Save file</button></p>
            </form>
          </div>
        </div></section>`);
    });

    route("/content-plan", () => desk("content", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">Your content plan</h1>
        <p class="lead">Quiet local café. Three to five posts a week. Warm, short, no hype.</p>
        <p class="ok">Active. Reply yes in the thread to accept a new plan.</p>
        ${[["Behind the scenes","2/wk · photo","Open, close, staff, the machine."],["Product","2/wk · photo","Coffee, pastry, the thing on the counter."],["Social proof","1/wk · photo","Regulars, reviews, a full room."]].map(([n,m,d]) => `<article class="row"><h2>${n}</h2><p class="muted" style="margin:0">${m}</p><p class="empty">${d}</p></article>`).join("")}
      </div></section>`));

    route("/operator", () => desk("home", `
      <section class="stage"><div class="page">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
          <h1 class="page-h1">All brands</h1>
          <a class="pill-dark" href="#/new-brand">Add brand</a>
        </div>
        <p class="lead">Every teammate Kip is running.</p>
        <a class="brand-card" href="#/brand"><strong>Harbour Espresso</strong><p class="empty">@harbourespresso · setup done · active</p></a>
        <a class="brand-card" href="#/brand"><strong>Northside Dental</strong><p class="empty">@northsidedental · setup in progress · active</p></a>
        <a class="brand-card" href="#/brand"><strong>Willow & Co</strong><p class="empty">Not connected · paused</p></a>
      </div></section>`));

    route("/brand", () => desk("home", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">Harbour Espresso</h1>
        <p class="lead">Client approves · <a href="#/memory">Memory</a> · <a href="#/history">History</a></p>
        <h2>Pending approvals</h2>
        ${state.waiting.length ? state.waiting.map(p => `
          <article class="row">
            <img src="${CROISSANT}" alt="" style="width:140px;height:140px;object-fit:cover;border-radius:16px" />
            <form data-edit="${p.id}" style="display:grid;gap:10px;margin-top:14px">
              <label class="label">Caption<textarea name="caption">${p.caption}</textarea></label>
              <p style="display:flex;gap:10px">
                <button class="pill-dark" type="submit">Save and approve</button>
                <button class="ghost" type="button" data-remove="${p.id}">Reject</button>
              </p>
            </form>
          </article>`).join("") : `<p class="empty">Nothing waiting.</p>`}
      </div></section>`));

    route("/history", () => desk("home", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">History</h1>
        <ul class="list">
          <li class="draft"><span class="when">Mon 8 Sep</span><p class="caption">Rain. Flat whites. That’s the morning.</p></li>
          <li class="draft"><span class="when">Sat 6 Sep</span><p class="caption">Almond croissant, still warm.</p></li>
        </ul>
      </div></section>`));

    route("/new-brand", () => desk("home", `
      <section class="stage"><div class="page">
        <h1 class="page-h1">Add a brand</h1>
        <form data-newbrand style="display:grid;gap:14px;max-width:480px">
          <label class="label">Name<input name="name" required /></label>
          <label class="label">Client phone<input name="phone" required placeholder="+614xxxxxxxx" /></label>
          <button class="pill-dark" type="submit">Create brand</button>
        </form>
      </div></section>`));

    function legal(title, body) {
      return `<main class="auth" style="align-items:stretch"><div class="page" style="max-width:720px;margin:0 auto">
        <p><a class="ghost" href="#/">← Kip</a></p>
        <h1 class="page-h1">${title}</h1>${body}
      </div></main>`;
    }
    route("/privacy", () => legal("Privacy", `<p class="doc"><p>Pulse holds a name, mobile number, photos, captions, and encrypted tokens so Kip can post after you say yes. We don’t train on it. Email will@jmcalder.com.</p></p>`));
    route("/terms", () => legal("Terms", `<p class="doc"><p>Kip drafts. You approve in the thread. Nothing with outside impact happens without that yes.</p></p>`));
    route("/deletion", () => legal("Data deletion", `<p class="doc"><p>Remove Pulse AI in Facebook → Business Integrations, then email will@jmcalder.com with “Delete my data”.</p></p>`));

    function render() {
      const path = location.hash.replace(/^#/, "") || "/";
      document.getElementById("app").innerHTML = (routes[path] || routes["/"])();
    }

    document.addEventListener("click", (e) => {
      const a = e.target.closest("[data-go]");
      if (a) { e.preventDefault(); go(a.getAttribute("data-go")); }
      const st = e.target.closest("[data-state]");
      if (st) {
        const live = st.dataset.state === "live";
        state.connected = live; state.phoneSet = live;
        if (!live) { state.x = false; state.threads = false; state.banner = ""; }
        else state.banner = { ok: true, text: "Instagram & Facebook connected." };
        toast(live ? "Previewing a connected account" : "Previewing setup");
        render();
      }
      const ap = e.target.closest("[data-approve]");
      if (ap) {
        const post = state.waiting.find(p => p.id === ap.dataset.approve);
        state.waiting = state.waiting.filter(p => p.id !== ap.dataset.approve);
        if (post) { state.upcoming.unshift(post); state.messages.push({ who: "you", text: "yes" }); }
        toast("Approved. It can post.");
        render();
      }
      const rm = e.target.closest("[data-remove]");
      if (rm) {
        state.waiting = state.waiting.filter(p => p.id !== rm.dataset.remove);
        state.upcoming = state.upcoming.filter(p => p.id !== rm.dataset.remove);
        toast("Removed.");
        render();
      }
      const tw = e.target.closest("[data-toast]");
      if (tw) { e.preventDefault(); toast(tw.dataset.toast); }
      const cx = e.target.closest("[data-connect]");
      if (cx) {
        if (cx.dataset.connect === "x") { state.x = true; state.banner = { ok: true, text: "X connected." }; }
        else { state.threads = true; state.banner = { ok: true, text: "Threads connected." }; }
        go("/connections");
      }
      const f = e.target.closest("[data-file]");
      if (f) { e.preventDefault(); state.file = f.dataset.file; render(); }
    });

    document.addEventListener("change", (e) => {
      const sk = e.target.closest("[data-skill]");
      if (sk) { state.skills[sk.dataset.skill] = sk.checked; toast(sk.checked ? "Skill on" : "Skill off"); }
    });

    document.addEventListener("submit", (e) => {
      if (e.target.matches("[data-landchat]")) { e.preventDefault(); go("/signup"); }
      if (e.target.matches("[data-login]")) { e.preventDefault(); state.phone = e.target.phone.value; go("/verify"); }
      if (e.target.matches("[data-signup]")) { e.preventDefault(); state.name = e.target.name.value; state.phone = e.target.phone.value; go("/verify"); }
      if (e.target.matches("[data-verify]")) { e.preventDefault(); go("/home"); }
      if (e.target.matches("[data-operator]")) { e.preventDefault(); go("/operator"); }
      if (e.target.matches("[data-phone]")) { e.preventDefault(); state.phone = e.target.phone.value; state.phoneSet = true; toast("Phone saved"); render(); }
      if (e.target.matches("[data-choose]")) { e.preventDefault(); state.connected = true; state.page = e.target.page.value; state.banner = { ok: true, text: "Instagram & Facebook connected." }; go("/home"); }
      if (e.target.matches("[data-pillar]")) { e.preventDefault(); toast("Cadence saved"); }
      if (e.target.matches("[data-newbrand]")) { e.preventDefault(); toast("Brand created"); go("/operator"); }
      if (e.target.matches("[data-routine]")) { e.preventDefault(); toast("Routine added"); e.target.reset(); }
      if (e.target.matches("[data-memory]")) { e.preventDefault(); if (state.file === "memory.md") state.memory = e.target.body.value; toast("File saved"); }
      if (e.target.matches("[data-chat]")) {
        e.preventDefault();
        const q = e.target.q.value.trim();
        if (!q) return;
        state.messages.push({ who: "you", text: q });
        state.messages.push({ who: "kip", text: "Got it. I’ll draft from that. Nothing posts without your yes." });
        e.target.reset();
        render();
      }
      if (e.target.matches("[data-edit]")) {
        e.preventDefault();
        const id = e.target.dataset.edit;
        const post = state.waiting.find(p => p.id === id);
        if (post) { post.caption = e.target.caption.value; state.upcoming.unshift(post); }
        state.waiting = state.waiting.filter(p => p.id !== id);
        toast("Saved and approved");
        go("/brand");
      }
    });

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
