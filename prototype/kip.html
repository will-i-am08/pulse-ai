<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kip</title>
  <style>
    :root {
      --black: #000;
      --white: #fff;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: #ececec;
      --soft: #f5f5f7;
      --ok: #1a7f4e;
      --bad: #b42318;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "SF Pro", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    a { color: inherit; }
    button, input, textarea, select { font-family: inherit; }
    button { cursor: pointer; }
    img { max-width: 100%; display: block; }

    /* —— landing (unchanged language) —— */
    .lp { background: #fff; color: #f5f5f7; overflow-x: hidden; }
    .hero { min-height: 100svh; min-height: 100dvh; height: 100svh; height: 100dvh; position: relative; overflow: hidden; background: #000; }
    .nav {
      position: fixed; inset: 0 0 auto 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      padding-top: max(18px, env(safe-area-inset-top, 0px));
      background: linear-gradient(180deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 70%, transparent 100%);
      transition: background .25s ease, box-shadow .25s ease, color .25s ease;
    }
    .nav.is-solid {
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 1px 0 rgba(0,0,0,.06);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      color: #fff; text-decoration: none; font-size: 19px; font-weight: 600; letter-spacing: -0.02em;
    }
    .nav.is-solid .brand { color: var(--ink); }
    .nav-links {
      display: flex; align-items: center; gap: 8px 22px; flex-wrap: wrap; justify-content: flex-end;
    }
    .nav-links a {
      color: rgba(255,255,255,.84); text-decoration: none; font-size: 15px; font-weight: 500;
    }
    .nav-links a:hover { color: #fff; }
    .nav.is-solid .nav-links a { color: var(--muted); }
    .nav.is-solid .nav-links a:hover { color: var(--ink); }
    .nav-links .nav-login { font-weight: 600; }
    .hero-copy {
      position: absolute; left: 0; right: 0; top: 0; z-index: 3;
      text-align: center; padding: clamp(96px, 16vh, 148px) 24px 0; pointer-events: none;
    }
    .hero-copy a { pointer-events: auto; }
    .hero-copy::before {
      content: ""; position: absolute; left: 0; right: 0; top: 0; height: 58%;
      background: linear-gradient(180deg, #000 0%, rgba(0,0,0,.55) 52%, transparent 100%);
      z-index: -1;
    }
    .h1 {
      font-size: clamp(56px, 9vw, 92px); font-weight: 600; letter-spacing: -0.038em;
      line-height: 1.02; margin: 0 0 28px; color: #fff;
    }
    .pill {
      display: inline-block; background: #fff; color: #000; font-size: 17px; font-weight: 600;
      letter-spacing: -0.01em; padding: 12px 22px; border-radius: 980px; text-decoration: none; border: 0;
    }
    .pill:hover { background: #f5f5f7; }
    .trust { margin: 18px 0 0; font-size: 19px; color: rgba(255,255,255,.52); }
    .hero-product { position: absolute; inset: 0; z-index: 1; }
    .photo-bleed {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 40% 40%, #c9b7a2 0%, transparent 40%), linear-gradient(160deg, #8a7460, #2c241c);
    }
    .ideas {
      background: #f5f5f7; color: var(--ink);
      padding: 72px 28px 80px;
    }
    .ideas-head { text-align: center; max-width: 28ch; margin: 0 auto 40px; }
    .ideas-head h2 {
      font-size: clamp(36px, 5vw, 52px); font-weight: 600; letter-spacing: -0.035em;
      line-height: 1.08; margin: 0 0 10px;
    }
    .ideas-head p { margin: 0; font-size: 20px; color: var(--muted); }
    .how {
      list-style: none; margin: 0 auto; padding: 0;
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      max-width: 1080px;
    }
    .how > li {
      background: #fff; border-radius: 28px; overflow: hidden;
      min-height: 420px;
    }
    .how > li:has(.with-sketch) { overflow: visible; }
    .how > li:has(.with-sketch) > a.how-card { border-radius: 28px; overflow: hidden; background: #fff; }
    .how > li > a {
      display: flex; flex-direction: column; height: 100%;
      text-decoration: none; color: inherit;
    }
    .hero-copy .h1,
    .hero-copy .pill,
    .hero-copy .trust {
      opacity: 0;
    }
    @media (prefers-reduced-motion: no-preference) {
      .hero-copy .h1 {
        animation: hero-in .85s cubic-bezier(.22,1,.36,1) .05s forwards;
      }
      .hero-copy .pill {
        animation: hero-in .85s cubic-bezier(.22,1,.36,1) .18s forwards;
      }
      .hero-copy .trust {
        animation: hero-in .85s cubic-bezier(.22,1,.36,1) .3s forwards;
      }
      .hero-product {
        animation: hero-fade 1.1s ease .15s both;
      }
      @keyframes hero-in {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes hero-fade {
        from { opacity: .55; transform: scale(1.03); }
        to { opacity: 1; transform: none; }
      }
      .reveal {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity .75s cubic-bezier(.22,1,.36,1), transform .75s cubic-bezier(.22,1,.36,1);
      }
      .reveal.in { opacity: 1; transform: none; }
      .reveal-d1 { transition-delay: .08s; }
      .reveal-d2 { transition-delay: .16s; }
      .reveal-d3 { transition-delay: .24s; }
      .how-card { transition: transform .25s ease, box-shadow .25s ease; }
      a.how-card:hover { transform: translateY(-2px); box-shadow: 0 18px 40px -28px rgba(0,0,0,.4); }
      .pill, .pill-dark { transition: transform .2s ease, background .2s ease; }
      .pill:hover, .pill-dark:hover { transform: translateY(-1px); }
      .trust-card, .plan {
        transition: transform .25s ease, box-shadow .25s ease;
      }
      .trust-card:hover, .plan:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 40px -28px rgba(0,0,0,.35);
      }
      .plan.featured:hover {
        box-shadow: 0 18px 40px -24px rgba(0,0,0,.55);
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; }
      .hero-copy .h1, .hero-copy .pill, .hero-copy .trust { opacity: 1; }
    }
    .how-visual {
      height: 240px; display: flex; align-items: flex-end; justify-content: flex-start;
      padding: 18px; position: relative;
    }
    .how-visual img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    }
    .how-visual .cap {
      position: relative; background: #e9e9eb; color: #1d1d1f;
      border-radius: 22px 22px 22px 8px; padding: 14px 16px; margin: 0;
      font-size: 16px; line-height: 1.35; max-width: 92%;
    }
    .how-visual.dark {
      background: #000; align-items: center; justify-content: center;
    }
    .how-yes {
      display: inline-block; background: #fff; color: #000; font-weight: 600;
      font-size: 28px; letter-spacing: -0.03em; padding: 12px 28px; border-radius: 980px;
    }
    .how-copy { padding: 22px 22px 26px; }
    .how-n { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .08em; }
    .how-copy h3 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.03em;
      line-height: 1.12; margin: 8px 0 8px;
    }
    .how-copy p { margin: 0; font-size: 16px; color: var(--muted); }
    .close {
      background: #000; color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 88px 24px 72px;
    }
    .close .h1 { color: #fff; }
    .close .trust { margin: 18px 0 32px; }
    .close-cta { position: relative; display: inline-block; }
    .footer {
      background: #000; color: rgba(255,255,255,.46);
      padding: 28px 28px 48px; display: flex; flex-wrap: wrap; gap: 14px 24px;
      justify-content: space-between; align-items: center; font-size: 14px;
    }
    .footer a { color: rgba(255,255,255,.46); text-decoration: none; }
    .footer a:hover { color: #fff; }
    .footer-links { display: flex; flex-wrap: wrap; gap: 20px; }

    .thread { margin: 0; display: flex; flex-direction: column; gap: 14px; }
    .thread.closeup { position: relative; width: 100%; height: 100%; }
    .thread.isolated { width: min(420px, 100%); }
    .msg { display: flex; max-width: 86%; }
    .msg p { margin: 0; font-size: 21px; line-height: 1.35; }
    .out { align-self: flex-end; margin-left: auto; }
    .in { align-self: flex-start; }
    .thread.closeup .photo-msg { position: absolute; inset: 0; max-width: none; width: 100%; height: 100%; }
    .thread.closeup .photo { width: 100%; height: 100%; object-fit: cover; }
    .thread.closeup .in { position: absolute; left: 3vw; bottom: 11vh; z-index: 1; max-width: min(520px, 54vw); }
    .thread.closeup .yes-msg { position: absolute; right: 3vw; bottom: 4.5vh; z-index: 1; }
    .thread.isolated .photo { width: 240px; height: 240px; object-fit: cover; border-radius: 28px 28px 8px 28px; }
    .in p { border-radius: 22px 22px 22px 8px; padding: 14px 18px; }
    .dark .in p { background: #2c2c2e; color: #f5f5f7; }
    .light .in p { background: #e9e9eb; color: #1d1d1f; }
    .yes { font-weight: 600; border-radius: 22px 22px 8px 22px; padding: 10px 20px; margin: 0; }
    .dark .yes { background: #fff; color: #000; }
    .light .yes { background: #1d1d1f; color: #fff; }

    /* Lindy-inspired product storytelling, still black/white */
    .band { background: #fff; color: var(--ink); padding: 88px 28px 96px; }
    .band-inner { max-width: 1080px; margin: 0 auto; text-align: center; }
    .band h2 {
      font-size: clamp(36px, 5vw, 52px); font-weight: 600; letter-spacing: -0.035em;
      line-height: 1.08; margin: 0 0 12px; text-align: center;
    }
    .band > .band-inner > .lead, .band .sub {
      text-align: center; color: var(--muted); font-size: 20px; max-width: 36ch; margin: 0 auto 40px;
    }
    .trust-grid, .plans, .who, .product-frame { text-align: left; }
    .trust-card, .plan { text-align: left; }

    .product-frame {
      background: var(--soft); border-radius: 28px; padding: 28px 18px 18px;
      display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px;
      position: relative; overflow: visible;
    }
    .pf {
      background: #fff; border-radius: 20px; padding: 18px 18px 16px; border: 1px solid var(--line);
    }
    .pf h4 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .rrow { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .rrow:last-child { border-bottom: 0; }
    .file {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
      background: var(--soft); border-radius: 12px; padding: 14px; color: #333; line-height: 1.5;
    }
    .who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin: 48px 0 56px; }
    .who h3 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.03em; }
    .who p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.45; }
    .dest {
      text-align: center; font-size: clamp(22px, 3vw, 28px); font-weight: 600;
      letter-spacing: -0.03em; margin: 0 0 10px;
    }
    .dest-note { text-align: center; color: var(--muted); font-size: 16px; margin: 0 0 48px; }
    .plate .sub { max-width: 42ch; }
    .ask { max-width: 640px; margin: 0 auto; text-align: left; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chip-link {
      font-size: 13px; padding: 6px 12px; border-radius: 980px; background: var(--soft);
      text-decoration: none; color: var(--ink);
    }

    .trust-band { background: var(--soft); }
    .trust-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 8px;
    }
    .trust-card {
      background: #fff; border-radius: 22px; padding: 26px 24px 28px;
    }
    .trust-card h3 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.03em; }
    .trust-card p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.45; }
    .trust-foot {
      text-align: center; color: var(--muted); font-size: 15px; margin: 28px auto 0; max-width: 44ch;
    }

    .pricing { background: #fff; }
    .bill-toggle {
      display: inline-flex; gap: 4px; padding: 4px; border-radius: 980px;
      background: var(--soft); margin: 0 auto 36px; position: relative;
    }
    .bill-toggle button {
      border: 0; background: transparent; color: var(--muted); font-size: 15px; font-weight: 600;
      padding: 10px 18px; border-radius: 980px;
    }
    .bill-toggle button.on { background: #000; color: #fff; }
    .plans {
      display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 860px; margin: 0 auto;
    }
    .plan {
      border: 1px solid var(--line); border-radius: 28px; padding: 28px 26px 30px;
      background: #fff; display: flex; flex-direction: column; gap: 14px;
    }
    .plan.featured { background: #000; color: #fff; border-color: #000; }
    .plan.featured .opt, .plan.featured .plan-list { color: rgba(255,255,255,.62); }
    .plan.featured .pill-dark { background: #fff; color: #000; }
    .plan.featured .pill-dark:hover { background: #f5f5f7; }
    .plan-name { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .plan.featured .plan-name { color: rgba(255,255,255,.55); }
    .plan-price { margin: 0; font-size: clamp(40px, 6vw, 52px); font-weight: 600; letter-spacing: -0.04em; line-height: 1; }
    .plan-price span { font-size: 17px; font-weight: 500; letter-spacing: -0.01em; opacity: .55; }
    .plan-blurb { margin: 0; font-size: 17px; color: var(--muted); }
    .plan.featured .plan-blurb { color: rgba(255,255,255,.7); }
    .plan-list { list-style: none; margin: 4px 0 8px; padding: 0; display: grid; gap: 10px; font-size: 16px; }
    .plan-list li { padding-left: 18px; position: relative; }
    .plan-list li::before { content: ""; position: absolute; left: 0; top: .55em; width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .35; }
    .plan .pill-dark { align-self: flex-start; margin-top: auto; text-align: center; }
    .price-note { text-align: center; color: var(--muted); font-size: 14px; margin: 22px 0 0; }

    .composer {
      display: flex; gap: 8px; align-items: center;
      background: #fff; border: 1px solid var(--line); border-radius: 980px; padding: 8px 8px 8px 18px;
      box-shadow: 0 16px 50px -28px rgba(0,0,0,.35);
    }
    .composer input {
      flex: 1; border: 0; outline: none; font-size: 16px; background: transparent; padding: 10px 0;
    }

    /* —— sketch accents (black, dotted, sparse) —— */
    .sketch {
      position: absolute; pointer-events: none; color: #1d1d1f;
      opacity: .78; overflow: visible;
    }
    .sketch path, .sketch line, .sketch circle, .sketch polyline, .sketch ellipse {
      fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round;
    }
    .sketch.dot { stroke-dasharray: 1.2 5.5; stroke-width: 1.6; }
    .sketch.dash { stroke-dasharray: 5 4; stroke-width: 1.55; }
    .sketch.ink { stroke-width: 1.7; stroke-dasharray: none; }
    .sketch.on-dark { color: rgba(255,255,255,.55); }
    .with-sketch { position: relative; }
    .sketch-title {
      display: block; position: relative; padding-bottom: 14px; text-align: center;
    }
    .sketch-title > .sketch {
      left: 0; right: 0; bottom: 0; margin: 0 auto;
      width: min(168px, 55%); height: 16px;
      transform: none;
    }
    .ideas-head .sketch-title > .sketch { color: #111; opacity: .7; width: min(140px, 60%); }
    .band .sketch-title > .sketch { color: #111; opacity: .65; }
    .plate h2.sketch-title > .sketch { width: min(220px, 58%); }
    .pricing h2.sketch-title > .sketch { width: min(200px, 58%); }
    .dest.sketch-title {
      display: inline-block; max-width: 100%; padding-bottom: 18px; margin-left: auto; margin-right: auto;
    }
    .dest.sketch-title > .sketch {
      width: min(280px, 90%); height: 20px; bottom: 0;
    }
    .doodle-arrow-yes {
      width: 92px; height: 78px; right: -6px; top: -28px; transform: rotate(8deg);
    }
    .doodle-save {
      width: 78px; height: 54px; right: -64px; top: -6px;
    }
    .doodle-loop {
      width: 120px; height: 70px; left: 50%; top: -34px; margin-left: -60px;
    }
    .doodle-cta {
      width: 70px; height: 58px; left: calc(100% + 6px); top: -36px;
    }
    .close { position: relative; }
    .ideas-head, .band h2, .dest { position: relative; }
    .how { position: relative; }
    .doodle-how {
      width: 64px; height: 48px; left: -10px; top: -22px;
    }
    .how-card.with-sketch { position: relative; overflow: visible; }
    @media (prefers-reduced-motion: no-preference) {
      .sketch.draw {
        opacity: 0;
        animation: sketch-in .7s ease forwards;
      }
      .ideas .sketch.draw { animation-delay: .05s; }
      .plate .sketch.draw { animation-delay: .1s; }
      .pricing .sketch.draw { animation-delay: .12s; }
      .close .sketch.draw { animation-delay: .08s; }
    }
    @keyframes sketch-in {
      from { opacity: 0; }
      to { opacity: .78; }
    }
    .sketch.on-dark.draw {
      animation-name: sketch-in-dark;
    }
    @keyframes sketch-in-dark {
      from { opacity: 0; }
      to { opacity: .55; }
    }

    .doc { color: var(--ink); font-size: 16px; line-height: 1.55; max-width: 68ch; }
    .doc .meta { color: var(--muted); font-size: 14px; margin: 0 0 28px; }
    .doc h2 {
      font-size: 20px; letter-spacing: -0.02em; margin: 32px 0 10px; font-weight: 600;
    }
    .doc p { margin: 0 0 14px; color: var(--ink); }
    .doc ul, .doc ol { margin: 0 0 16px; padding-left: 1.2em; }
    .doc li { margin: 0 0 8px; }
    .doc a { color: var(--ink); text-decoration: underline; text-underline-offset: 2px; }
    .legal-wrap {
      background: #fff; min-height: 100svh; color: var(--ink);
      padding: 28px 24px 72px;
    }
    .legal-wrap .page { max-width: 720px; margin: 0 auto; }
    .legal-wrap .ghost {
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      color: var(--muted); font-size: 15px; border: 0; background: none; padding: 0; margin-bottom: 18px;
    }
    .legal-wrap .ghost .mark-bare { width: 22px; height: 22px; }
    .legal-wrap .ghost:hover { color: var(--ink); }
    .legal-wrap .page-h1 { margin-bottom: 8px; }

    /* —— app: teammate workspace —— */
    .desk {
      min-height: 100svh; display: grid; grid-template-columns: 232px 1fr;
      background: var(--soft);
    }
    .desk.three { grid-template-columns: 232px 1fr 340px; }
    .topbar { display: none; }
    .menu-btn, .scrim { display: none; }
    .rail {
      background: #f3f3f5; padding: 18px 12px 24px; display: flex; flex-direction: column; gap: 4px;
    }
    .rail-nav { display: flex; flex-direction: column; gap: 4px; }
    .rail .brand { color: var(--ink); font-size: 17px; padding: 8px 10px 18px; }
    .rail a, .rail button.navb {
      display: block; width: 100%; text-align: left; text-decoration: none;
      padding: 9px 12px; border-radius: 10px; color: var(--muted); font-size: 15px;
      background: none; border: 0;
    }
    .rail a.on, .rail a:hover, .rail button.navb:hover { background: #fff; color: var(--ink); }
    .rail .spacer { flex: 1; }
    .stage {
      margin: 12px 12px 12px 0; background: #fff; border-radius: 22px;
      display: flex; flex-direction: column; min-height: calc(100svh - 24px); overflow: hidden;
    }
    .desk.three .stage { margin-right: 0; }
    .aside {
      margin: 12px 12px 12px 12px; background: #fff; border-radius: 22px; padding: 22px 20px;
      overflow: auto;
    }
    .aside h2 { margin: 0 0 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .chat {
      flex: 1; overflow: auto; padding: 28px 32px 12px; display: flex; flex-direction: column; gap: 12px;
    }
    .bubble { max-width: 78%; }
    .bubble.kip p { background: #e9e9eb; border-radius: 22px 22px 22px 8px; padding: 12px 16px; margin: 0; }
    .bubble.you { margin-left: auto; }
    .bubble.you p { background: #1d1d1f; color: #fff; border-radius: 22px 22px 8px 22px; padding: 12px 16px; margin: 0; }
    .bubble img { width: 220px; height: 220px; object-fit: cover; border-radius: 22px 22px 8px 22px; }
    .dock { padding: 12px 20px 20px; }
    .page {
      flex: 1; overflow: auto; padding: 36px 40px 64px;
    }
    .page-h1 {
      font-size: clamp(28px, 4vw, 40px); font-weight: 600; letter-spacing: -0.035em;
      margin: 0 0 8px; line-height: 1.1;
    }
    .lead { margin: 0 0 1.6rem; font-size: 18px; color: var(--muted); }
    .row { padding: 1.6rem 0; border-bottom: 1px solid var(--line); }
    .row h2, .panel h2 { margin: 0 0 8px; font-size: 19px; }
    .status { margin: 0; font-size: 21px; font-weight: 600; }
    .muted, .empty { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
    .setup { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 18px; }
    .setup-head { display: flex; justify-content: space-between; font-size: 16px; font-weight: 600; }
    .need, .done { font-size: 13px; font-weight: 500; }
    .done { color: var(--muted); }
    .quiet-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .quiet-form input { flex: 1 1 180px; }

    input[type="text"], input[type="tel"], input[type="email"], input[type="password"],
    input[type="number"], input[type="url"], input[type="datetime-local"], textarea, select {
      font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px;
      background: #fff; color: var(--ink);
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
    textarea { width: 100%; min-height: 96px; resize: vertical; }
    .pill-dark {
      display: inline-block; background: #000; color: #fff; font-size: 15px; font-weight: 600;
      padding: 11px 18px; border-radius: 980px; text-decoration: none; border: 0;
    }
    .pill-dark:hover { background: #1d1d1f; }
    .ghost { background: none; border: 0; color: var(--muted); font-size: 15px; padding: 0; }
    .ghost:hover { color: var(--ink); }
    .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .draft { display: grid; grid-template-columns: 140px 1fr; gap: 12px; font-size: 16px; }
    .when { color: var(--muted); font-size: 14px; }
    .caption { margin: 0; }
    .draft-actions { display: flex; gap: 12px; margin-top: 6px; }
    .text-btn { background: none; border: 0; padding: 0; font-size: 14px; color: var(--muted); }
    .text-btn:hover { color: var(--ink); }
    .text-btn.bad { color: var(--bad); }
    .banner { font-size: 15px; margin: 0 0 1rem; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    .auth {
      min-height: 100svh; background: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 48px 20px 80px;
    }
    .auth-card { width: 100%; max-width: 420px; display: grid; gap: 14px; }
    .auth .page-h1 { font-size: 40px; }
    .auth .pill-dark { width: 100%; text-align: center; }
    .label { display: flex; flex-direction: column; gap: 6px; font-size: 15px; font-weight: 500; }
    .opt { font-weight: 400; color: var(--muted); font-size: 13px; }
    .alt { text-align: center; color: var(--muted); font-size: 15px; }
    .alt a { color: var(--ink); }
    .operator { margin-top: 20px; width: 100%; max-width: 420px; color: var(--muted); font-size: 14px; text-align: center; }
    .operator summary { cursor: pointer; list-style: none; }
    .operator summary::-webkit-details-marker { display: none; }
    .operator-form { display: grid; gap: 10px; text-align: left; margin-top: 12px; }
    .radios { display: flex; gap: 18px; font-weight: 400; }
    .week-nav { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .week { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 8px; overflow-x: auto; }
    .day { min-height: 150px; border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--soft); }
    .day.today { background: #fff; border-color: #000; }
    .day-h { font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .card-post { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; font-size: 12px; margin-bottom: 8px; }
    .chip { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #eef1f5; }
    .chip.yes { background: #f3f3f4; }
    .chip.auto { background: #eafaf0; color: #1a7f4e; }
    .pillar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .choice {
      display: flex; gap: 12px; align-items: flex-start; padding: 16px;
      border: 1px solid var(--line); border-radius: 14px; cursor: pointer; margin-bottom: 10px;
    }
    .choice.disabled { opacity: .5; cursor: not-allowed; }
    .oauth { min-height: 100svh; display: grid; place-items: center; background: var(--soft); padding: 24px; }
    .oauth-card {
      background: #fff; border-radius: 20px; padding: 36px 28px; max-width: 420px; width: 100%;
      box-shadow: 0 20px 60px -30px rgba(0,0,0,.3);
    }
    .doc p { font-size: 18px; color: var(--muted); }
    .files { display: grid; grid-template-columns: 180px 1fr; gap: 16px; }
    .files nav a {
      display: block; padding: 8px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 14px;
    }
    .files nav a.on { background: var(--soft); color: var(--ink); }
    .toggle { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .brand-card {
      display: block; text-decoration: none; padding: 18px; border: 1px solid var(--line);
      border-radius: 16px; margin-bottom: 10px;
    }
    .brand-card:hover { background: var(--soft); }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);

      font-size: 15px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .toast.show { opacity: 1; }
    .proto {
      position: fixed; right: 16px; bottom: 16px; z-index: 50;
      background: #1d1d1f; color: #fff; border-radius: 16px; padding: 12px 14px;
      font-size: 12px; width: 220px;
    }
    .proto summary { cursor: pointer; font-weight: 600; list-style: none; }
    .proto nav { display: grid; gap: 4px; margin-top: 10px; }
    .proto a, .proto button {
      color: rgba(255,255,255,.8); text-decoration: none; background: none; border: 0;
      text-align: left; padding: 4px 0; font-size: 12px;
    }
    .proto a:hover, .proto button:hover { color: #fff; }
    .proto .note { color: rgba(255,255,255,.5); margin: 8px 0 0; }
    .mark {
      width: 36px; height: 36px; border-radius: 50%;
      display: block; object-fit: cover; flex: 0 0 auto;
    }
    .mark-bare {
      width: 40px; height: 40px; border-radius: 0;
      display: block; object-fit: contain; flex: 0 0 auto;
    }
    .rail .mark, .topbar .brand .mark,
    .rail .mark-bare, .topbar .brand .mark-bare { width: 28px; height: 28px; }
    .cat-spot {
      display: flex; justify-content: center; margin: 0 auto 18px;
    }
    .cat-spot .mark-bare { width: 52px; height: 52px; }
    .cat-spot.sm .mark-bare { width: 52px; height: 52px; }
    .close .cat-spot { margin-bottom: 22px; }
    .close .cat-spot .mark { width: 48px; height: 48px; margin: 0 auto; }
    .footer-brand {
      display: inline-flex; align-items: center; gap: 10px;
    }
    .footer-brand .mark { width: 22px; height: 22px; opacity: .9; }
    .auth-mark { display: flex; justify-content: center; margin-bottom: 18px; }
    .auth-mark .mark-bare { width: 56px; height: 56px; }

    @media (max-width: 980px) {
      .desk, .desk.three {
        grid-template-columns: 1fr;
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      .topbar {
        display: flex; align-items: center; gap: 10px;
        position: sticky; top: 0; z-index: 30;
        padding: 10px 14px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
        background: rgba(255,255,255,.96);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .topbar .brand {
        display: inline-flex; align-items: center; gap: 8px;
        color: var(--ink); text-decoration: none; font-size: 17px; font-weight: 600;
        letter-spacing: -0.02em; flex: 1;
      }
      .topbar .brand .mark { width: 28px; height: 28px; }
      .topbar .brand .mark-bare { width: 28px; height: 28px; }
      .menu-btn {
        display: inline-flex; align-items: center; justify-content: center;
        width: 44px; height: 44px; border: 0; border-radius: 12px;
        background: var(--soft); color: var(--ink); padding: 0; flex: 0 0 auto;
      }
      .menu-btn svg { width: 20px; height: 20px; display: block; }
      .topbar .ghost { flex: 0 0 auto; padding: 8px 4px; }
      .scrim {
        display: none; position: fixed; inset: 0; z-index: 40;
        background: rgba(0,0,0,.4); border: 0; padding: 0; cursor: pointer;
      }
      .desk.menu-open .scrim { display: block; }
      .desk.menu-open { overflow: hidden; }
      body:has(.desk.menu-open) { overflow: hidden; }
      .rail {
        position: fixed; top: 0; left: 0; bottom: 0; z-index: 50;
        width: min(300px, 86vw);
        padding: 18px 14px calc(24px + env(safe-area-inset-bottom, 0px));
        padding-top: max(18px, env(safe-area-inset-top, 0px));
        background: #f7f7f8;
        box-shadow: 16px 0 40px -24px rgba(0,0,0,.35);
        transform: translateX(-105%);
        transition: transform .22s ease;
        overflow-y: auto; -webkit-overflow-scrolling: touch;
      }
      .desk.menu-open .rail { transform: translateX(0); }
      .rail .brand { display: none; }
      .rail-nav { gap: 2px; }
      .rail-nav a, .rail .navb {
        padding: 14px 14px; font-size: 17px; border-radius: 12px;
      }
      .rail-nav a.on { background: #fff; color: var(--ink); box-shadow: 0 1px 0 var(--line); }
      .rail .spacer { min-height: 24px; }
      .stage {
        margin: 0; border-radius: 0;
        min-height: calc(100dvh - 56px);
        width: 100%; max-width: 100%;
        overflow-x: hidden;
      }
      .desk.three .stage { margin: 0; }
      .aside {
        margin: 0; border-radius: 0; padding: 20px 18px 32px;
        width: 100%; max-width: 100%; overflow-x: hidden;
      }
      .page { padding: 24px 18px 48px; overflow-x: hidden; }
      .chat { padding: 18px 16px 8px; }
      .dock { padding: 10px 12px calc(14px + env(safe-area-inset-bottom, 0px)); }
      .files, .how, .who, .product-frame, .trust-grid, .plans { grid-template-columns: 1fr; }
      .doodle-arrow-yes, .doodle-how, .doodle-save, .doodle-cta, .doodle-loop { display: none; }
      .ideas { padding: 48px 20px 56px; }
      .how > li { min-height: 0; }
      .band { padding: 56px 20px 64px; }
      .who { gap: 22px; margin: 32px 0 40px; }
      .files { grid-template-columns: 1fr; }
      .files nav { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; }
      .week {
        display: flex; gap: 8px; overflow-x: auto; max-width: 100%;
        padding-bottom: 8px; -webkit-overflow-scrolling: touch;
      }
      .week .day { flex: 0 0 148px; min-width: 148px; }
      .bubble { max-width: 92%; }
      .bubble img { max-width: 100%; height: auto; }
      .draft { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .nav { padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top, 0px)); }
      .nav-links { gap: 6px 14px; }
      .nav-links a { font-size: 14px; }
      .hero-copy { padding-top: 80px; }
      .h1 { font-size: clamp(40px, 11vw, 52px); margin-bottom: 18px; }
      .trust { font-size: 16px; padding: 0 8px; }
      .pill { font-size: 16px; padding: 12px 20px; }
      .thread.closeup .in {
        left: 16px; right: 16px; bottom: 12svh; max-width: none;
      }
      .thread.closeup .in p { font-size: 16px; }
      .thread.closeup .yes-msg { right: 16px; bottom: 4svh; }
      .ideas { padding: 40px 16px 48px; }
      .how-visual { height: 200px; }
      .dest { font-size: 20px; line-height: 1.35; }
      .ask .composer, .dock .composer {
        flex-direction: column; align-items: stretch;
        border-radius: 20px; padding: 10px;
      }
      .ask .composer .pill-dark, .dock .composer .pill-dark { width: 100%; text-align: center; }
      .footer { padding: 24px 16px 40px; flex-direction: column; align-items: flex-start; }
      .draft { grid-template-columns: 1fr; }
      .bubble img { width: 180px; height: 180px; }
      .bubble { max-width: 92%; }
      .auth { padding: 32px 16px 48px; }
      .auth .page-h1 { font-size: 32px; }
      .radios { flex-direction: column; gap: 10px; }
      .proto {
        right: 10px; bottom: 10px; width: min(196px, calc(100vw - 20px));
        max-height: 42vh; overflow: auto;
      }
      .toast { bottom: 16px; left: 12px; right: 12px; transform: none; text-align: center; }
      .close { padding: 64px 20px 56px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>
  <details class="proto">
    <summary>Prototype jumps</summary>
    <nav>
      <a href="#/">Landing</a>
      <a href="#/signup">Sign up</a>
      <a href="#/login">Log in</a>
      <a href="#/home">Thread</a>
      <a href="#/plan">Calendar</a>
      <a href="#/routines">Routines</a>
      <a href="#/memory">Memory</a>
      <a href="#/connections">Connections</a>
      <a href="#/operator">Operator</a>
      <a href="#/brand">Approvals</a>
      <button type="button" data-state="setup">State: setting up</button>
      <button type="button" data-state="live">State: connected</button>
    </nav>
    <p class="note">Clickable mock. Download this file when you’re happy.</p>
  </details>

  <script>
    const PHOTO = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1800&q=80";
    const CROISSANT = "https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=800&q=80";

    const mark = (cls = "mark") =>
      `<img class="${cls}" src="kip-mark.png" width="36" height="36" alt="" />`;
    const cat = (cls = "mark-bare") =>
      `<img class="${cls}" src="kip-cat.png" width="40" height="40" alt="Kip" />`;
    const catSpot = (size = "") =>
      `<div class="cat-spot ${size}" aria-hidden="true">${cat()}</div>`;

    /* Black dotted/sketch accents — sparse, decorative only */
    const doodles = {
      underline: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 200 16" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
          <path d="M10 9c20-5 40 5 60 0s40-5 60 0 40 5 60 0"/>
        </svg>`,
      squiggle: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 200 20" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
          <path d="M8 12c22-8 36 8 56 0s34-10 52 2 36 6 68-4"/>
        </svg>`,
      arrowYes: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 92 78" aria-hidden="true">
          <path d="M12 12c18 6 38 28 48 48"/>
          <path class="ink" d="M52 52l10 10 2-14" style="stroke-dasharray:none;stroke-width:1.7"/>
          <path class="ink" d="M52 52l14 2" style="stroke-dasharray:none;stroke-width:1.7"/>
        </svg>`,
      loop: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 120 70" aria-hidden="true">
          <path d="M18 42c8-22 42-28 58-12s6 36-16 40c-18 4-34-10-30-24 3-12 18-16 28-10"/>
        </svg>`,
      save: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 78 54" aria-hidden="true">
          <path d="M8 40c14-4 28-22 42-28"/>
          <path class="ink" d="M42 8l10 6-12 4" style="stroke-dasharray:none;stroke-width:1.7"/>
          <circle class="dot" cx="14" cy="44" r="3" style="stroke-dasharray:1 3;stroke-width:1.3"/>
        </svg>`,
      cta: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 70 58" aria-hidden="true" preserveAspectRatio="xMidYMid meet">
          <path d="M52 8c-2 12-10 24-28 34"/>
          <path style="stroke-dasharray:none;stroke-width:1.7" d="M18 34l8 10 12-6"/>
        </svg>`,
      ticks: (cls = "") => `
        <svg class="sketch dash draw ${cls}" viewBox="0 0 64 48" aria-hidden="true">
          <path d="M8 28l10 10 20-24"/>
          <path class="dot" d="M40 34c6-2 12-2 18 2" style="stroke-dasharray:1.2 4;stroke-width:1.4"/>
        </svg>`,
    };

    const state = {
      billing: "monthly",
      connected: false,
      phoneSet: false,
      x: false,
      threads: false,
      name: "Harbour Espresso",
      phone: "0412 000 000",
      page: "Harbour Espresso",
      ig: "harbourespresso",
      banner: "",
      file: "memory.md",
      skills: { draft: true, replies: true, reports: true, ads: false },
      memory: "Weekly report goes out Mondays, 9am.\\nNever post without a yes.\\nTone is warm, short, no hype.\\nAlmond croissant is the hero pastry.",
      messages: [
        { who: "you", photo: true },
        { who: "kip", text: "Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go.\\n\\nReply yes to post." },
        { who: "you", text: "yes" }
      ],
      waiting: [
        { id: "w1", when: "Thu 11 Sep, 7:30 am", caption: "Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go." }
      ],
      upcoming: [
        { id: "u1", when: "Fri 12 Sep, 8:00 am", caption: "Behind the bar before open. Steam, sunlight, same playlist as last year." },
        { id: "u2", when: "Sat 13 Sep, 9:00 am", caption: "Almond croissant, still warm. That’s the post." }
      ]
    };

    const routes = {};
    const route = (path, fn) => { routes[path] = fn; };
    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function go(path) { location.hash = path.startsWith("#") ? path : "#" + path; }

    function rail(active) {
      return `
        <aside class="rail" id="app-menu" aria-label="Menu">
          <a class="brand" href="#/home">${cat("mark-bare")} <span>Kip</span></a>
          <nav class="rail-nav">
            <a href="#/home" class="${active === "home" ? "on" : ""}">Thread</a>
            <a href="#/plan" class="${active === "plan" ? "on" : ""}">Calendar</a>
            <a href="#/routines" class="${active === "routines" ? "on" : ""}">Routines</a>
            <a href="#/memory" class="${active === "memory" ? "on" : ""}">Memory</a>
            <a href="#/connections" class="${active === "connections" ? "on" : ""}">Connections</a>
            <a href="#/content-plan" class="${active === "content" ? "on" : ""}">Plan</a>
            <a href="#/operator">Operator</a>
          </nav>
          <div class="spacer"></div>
          <button class="navb rail-out" data-go="#/">Sign out</button>
        </aside>`;
    }

    function topbar() {
      return `
        <header class="topbar">
          <button class="menu-btn" type="button" data-menu="open" aria-label="Open menu" aria-controls="app-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <path d="M4 7h16M4 12h16M4 17h16"/>
            </svg>
          </button>
          <a class="brand" href="#/home">${cat("mark-bare")} <span>Kip</span></a>
          <button class="ghost" type="button" data-go="#/">Sign out</button>
        </header>
        <button class="scrim" type="button" data-menu="close" aria-label="Close menu"></button>`;
    }

    function desk(active, main, aside) {
      return `<div class="desk ${aside ? "three" : ""}">${topbar()}${rail(active)}${main}${aside || ""}</div>`;
    }

    function thread(tone, size) {
      const img = size === "closeup"
        ? `<div class="photo-bleed photo" role="img" aria-label="A coffee and an almond croissant" style="background-image:url('${PHOTO}');background-size:cover;background-position:center"></div>`
        : `<img class="photo" src="${CROISSANT}" alt="A photo of a coffee and an almond croissant" />`;
      return `
        <figure class="thread ${tone} ${size}" aria-label="A text thread: a photo sent, a caption back, the word yes">
          <div class="msg out photo-msg">${img}</div>
          <div class="msg in"><p>Saturday morning energy — first pour of the day. Come grab a cup before the almond croissants go.<br><br>Reply yes to post.</p></div>
          <div class="msg out yes-msg"><p class="yes">yes</p></div>
        </figure>`;
    }

    route("/", () => `
      <main class="lp">
        <header class="nav" id="lp-nav">
          <a class="brand" href="#/" data-scroll="top">${mark()} <span>Kip</span></a>
          <nav class="nav-links" aria-label="Landing">
            <a href="#about" data-scroll="about">About</a>
            <a href="#pricing" data-scroll="pricing">Pricing</a>
            <a class="nav-login" href="#/login">Login</a>
          </nav>
        </header>
        <section class="hero" id="top" aria-label="Kip">
          <div class="hero-copy">
            <h1 class="h1">Text a photo.<br>It’s posted.</h1>
            <a class="pill" href="#/signup">Get started</a>
            <p class="trust">Kip can take the lot. Nothing posts without your yes.</p>
          </div>
          <div class="hero-product">${thread("dark", "closeup")}</div>
        </section>
        <section class="ideas" id="how" aria-label="How Kip works">
          <div class="ideas-head reveal">
            ${catSpot()}
            <h2 class="sketch-title">Three moves.${doodles.underline()}</h2>
            <p>That’s the loop. Kip can also run the rest.</p>
          </div>
          <ol class="how">
            ${doodles.ticks("doodle-how sketch")}
            <li class="reveal reveal-d1">
              <a class="how-card" href="#/signup">
                <div class="how-visual">
                  <img src="${CROISSANT}" alt="A photo of an almond croissant" />
                </div>
                <div class="how-copy">
                  <div class="how-n">01</div>
                  <h3>You send a photo.</h3>
                  <p>From the floor, in the thread. That’s the brief.</p>
                </div>

    let landingScrollHandler = null;
    const LANDING_SECTIONS = new Set(["about", "pricing", "how", "privacy", "top", "get-started"]);

    function initLanding() {
      if (landingScrollHandler) {
        window.removeEventListener("scroll", landingScrollHandler);
        landingScrollHandler = null;
      }
      const nav = document.getElementById("lp-nav");
      const hero = document.querySelector(".hero");
      if (nav && hero) {
        const syncNav = () => {
          nav.classList.toggle("is-solid", window.scrollY > Math.max(40, hero.offsetHeight * 0.55));
        };
        syncNav();
        landingScrollHandler = syncNav;
        window.addEventListener("scroll", landingScrollHandler, { passive: true });
      }
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const nodes = document.querySelectorAll(".reveal");
      if (!nodes.length) return;
      if (reduce || !("IntersectionObserver" in window)) {
        nodes.forEach((el) => el.classList.add("in"));
        return;
      }
      const io = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;
          entry.target.classList.add("in");
          io.unobserve(entry.target);
        });
      }, { threshold: 0.14, rootMargin: "0px 0px -6% 0px" });
      nodes.forEach((el) => io.observe(el));
    }

    function scrollLanding(id) {
      if (id === "top") {
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }
      const el = document.getElementById(id);
      if (!el) return;
      const nav = document.getElementById("lp-nav");
      const offset = nav ? nav.offsetHeight + 8 : 0;
      const top = el.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top, behavior: "smooth" });
    }

    function render() {
      const raw = location.hash.replace(/^#/, "") || "/";
      if (LANDING_SECTIONS.has(raw)) {
        document.getElementById("app").innerHTML = routes["/"]();
        requestAnimationFrame(() => {
          initLanding();
          scrollLanding(raw);
        });
        return;
      }
      document.getElementById("app").innerHTML = (routes[raw] || routes["/"])();
      if (raw === "/" || raw === "") requestAnimationFrame(() => initLanding());
    }

    document.addEventListener("click", (e) => {
      const scroll = e.target.closest("[data-scroll]");
      if (scroll) {
        e.preventDefault();
        const id = scroll.getAttribute("data-scroll");
        const raw = location.hash.replace(/^#/, "") || "/";
        const onHome = raw === "/" || LANDING_SECTIONS.has(raw);
        if (!onHome) {
          history.replaceState(null, "", "#/");
          document.getElementById("app").innerHTML = routes["/"]();
          requestAnimationFrame(() => {
            initLanding();
            scrollLanding(id);
          });
        } else {
          history.replaceState(null, "", "#/");
          scrollLanding(id);
        }
        return;
      }
      const bill = e.target.closest("[data-bill]");
      if (bill) {
        e.preventDefault();
        state.billing = bill.dataset.bill;
        const y = window.scrollY;
        render();
        requestAnimationFrame(() => window.scrollTo(0, y));
        return;
      }
      const menu = e.target.closest("[data-menu]");
      if (menu) {
        e.preventDefault();
        const deskEl = document.querySelector(".desk");
        if (!deskEl) return;
        if (menu.dataset.menu === "open") deskEl.classList.add("menu-open");
        else deskEl.classList.remove("menu-open");
        return;
      }
      const navLink = e.target.closest(".rail-nav a, .rail-out");
      if (navLink) {
        const deskEl = document.querySelector(".desk");
        if (deskEl) deskEl.classList.remove("menu-open");
      }
      const a = e.target.closest("[data-go]");
      if (a) { e.preventDefault(); go(a.getAttribute("data-go")); }
      const st = e.target.closest("[data-state]");
      if (st) {
        const live = st.dataset.state === "live";
        state.connected = live; state.phoneSet = live;
        if (!live) { state.x = false; state.threads = false; state.banner = ""; }
        else state.banner = { ok: true, text: "Instagram & Facebook connected." };
        toast(live ? "Previewing a connected account" : "Previewing setup");
        render();
      }
      const ap = e.target.closest("[data-approve]");
      if (ap) {
        const post = state.waiting.find(p => p.id === ap.dataset.approve);
        state.waiting = state.waiting.filter(p => p.id !== ap.dataset.approve);
        if (post) { state.upcoming.unshift(post); state.messages.push({ who: "you", text: "yes" }); }
        toast("Approved. It can post.");
        render();
      }
      const rm = e.target.closest("[data-remove]");
      if (rm) {
        state.waiting = state.waiting.filter(p => p.id !== rm.dataset.remove);
        state.upcoming = state.upcoming.filter(p => p.id !== rm.dataset.remove);
        toast("Removed.");
        render();
      }
      const tw = e.target.closest("[data-toast]");
      if (tw) { e.preventDefault(); toast(tw.dataset.toast); }
      const cx = e.target.closest("[data-connect]");
      if (cx) {
        if (cx.dataset.connect === "x") { state.x = true; state.banner = { ok: true, text: "X connected." }; }
        else { state.threads = true; state.banner = { ok: true, text: "Threads connected." }; }
        go("/connections");
      }
      const f = e.target.closest("[data-file]");
      if (f) { e.preventDefault(); state.file = f.dataset.file; render(); }
    });

    document.addEventListener("change", (e) => {
      const sk = e.target.closest("[data-skill]");
      if (sk) { state.skills[sk.dataset.skill] = sk.checked; toast(sk.checked ? "Skill on" : "Skill off"); }
    });

    document.addEventListener("submit", (e) => {
      if (e.target.matches("[data-landchat]")) { e.preventDefault(); go("/signup"); }
      if (e.target.matches("[data-login]")) { e.preventDefault(); state.phone = e.target.phone.value; go("/verify"); }
      if (e.target.matches("[data-signup]")) { e.preventDefault(); state.name = e.target.name.value; state.phone = e.target.phone.value; go("/verify"); }
      if (e.target.matches("[data-verify]")) { e.preventDefault(); go("/home"); }
      if (e.target.matches("[data-operator]")) { e.preventDefault(); go("/operator"); }
      if (e.target.matches("[data-phone]")) { e.preventDefault(); state.phone = e.target.phone.value; state.phoneSet = true; toast("Phone saved"); render(); }
      if (e.target.matches("[data-choose]")) { e.preventDefault(); state.connected = true; state.page = e.target.page.value; state.banner = { ok: true, text: "Instagram & Facebook connected." }; go("/home"); }
      if (e.target.matches("[data-pillar]")) { e.preventDefault(); toast("Cadence saved"); }
      if (e.target.matches("[data-newbrand]")) { e.preventDefault(); toast("Brand created"); go("/operator"); }
      if (e.target.matches("[data-routine]")) { e.preventDefault(); toast("Routine added"); e.target.reset(); }
      if (e.target.matches("[data-memory]")) { e.preventDefault(); if (state.file === "memory.md") state.memory = e.target.body.value; toast("File saved"); }
      if (e.target.matches("[data-chat]")) {
        e.preventDefault();
        const q = e.target.q.value.trim();
        if (!q) return;
        state.messages.push({ who: "you", text: q });
        state.messages.push({ who: "kip", text: "Got it. I’ll draft from that. Nothing posts without your yes." });
        e.target.reset();
        render();
      }
      if (e.target.matches("[data-edit]")) {
        e.preventDefault();
        const id = e.target.dataset.edit;
        const post = state.waiting.find(p => p.id === id);
        if (post) { post.caption = e.target.caption.value; state.upcoming.unshift(post); }
        state.waiting = state.waiting.filter(p => p.id !== id);
        toast("Saved and approved");
        go("/brand");
      }
    });

    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
